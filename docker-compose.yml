version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: farmsetu_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: farmsetu_db
      MYSQL_USER: farmsetu_user
      MYSQL_PASSWORD: farmsetu_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmsetu_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://farmsetu_user:farmsetu_password@mysql:3306/farmsetu_db
      - FRONTEND_URL=http://localhost:5173
      - SECRET_KEY=farmsetu_super_secret_jwt_key_agritech_2026_change_in_prod
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmsetu_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
